<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked · BlockTheNoise</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <img src="icons/icon128.png" alt="" width="72" height="72" />
      <h1>This one's on mute.</h1>
      <p class="quote" id="quote"></p>
      <div class="timer" id="timer" hidden>
        <span class="label" id="timer-label">Focus</span>
        <span class="time" id="timer-time">--:--</span>
      </div>
      <p class="hint" id="hint"></p>
      <button id="btn-close">Close this tab and get back to it</button>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
