<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store screenshot</title>
    <style>
      :root { --bg: #0d0f14; --text: #f1f3f8; --muted: #a0a7b6; --accent: #e5484d; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 78% 45%, rgba(229, 72, 77, 0.22), transparent 42%),
          radial-gradient(circle at 10% 100%, rgba(48, 164, 108, 0.10), transparent 40%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        display: grid;
        grid-template-columns: 1fr 520px;
        align-items: center;
        padding: 0 96px 0 104px;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 20px; color: var(--muted); margin-bottom: 36px; }
      .brand img { width: 40px; height: 40px; }
      .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 15px; margin-bottom: 14px; }
      h1 { font-size: 60px; line-height: 1.05; margin: 0 0 22px; letter-spacing: -1px; max-width: 560px; }
      p { font-size: 22px; line-height: 1.5; color: var(--muted); margin: 0; max-width: 500px; }
      .device {
        justify-self: center;
        width: 442px; /* 340px popup at 1.3x */
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid #2c313d;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 8px rgba(255, 255, 255, 0.03);
        background: #111318;
      }
      .device iframe {
        display: block;
        width: 340px;
        border: 0;
        transform: scale(1.3);
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand"><img src="/_g/icon512.png" alt="" />BlockTheNoise</div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <div class="device" id="device"><iframe id="frame" scrolling="no"></iframe></div>
    <script>
      const view = new URLSearchParams(location.search).get("view") ?? "focus";
      const copy = {
        focus: ["Pomodoro timer", "Focus in 25-minute sprints.", "Timed focus sessions with breaks built in, and the minutes left right on your toolbar."],
        music: ["Flow music", "Music that keeps you in flow.", "Ambient radio and offline noise that start when you focus and pause on breaks."],
        block: ["Site blocker", "Block the noise.", "Instagram, YouTube and Facebook stay quiet. Add any other site in one click."],
      }[view];
      [eyebrow.textContent, title.textContent, sub.textContent] = copy;
      // Size the frame to the popup's rendered content once it has drawn its state.
      frame.addEventListener("load", () => {
        setTimeout(() => {
          const height = frame.contentDocument.body.offsetHeight;
          frame.style.height = height + "px";
          device.style.height = Math.round(height * 1.3) + "px";
        }, 300);
      });
      frame.style.height = "520px";
      frame.src = "/popup.html?view=" + view;
    </script>
  </body>
</html>
